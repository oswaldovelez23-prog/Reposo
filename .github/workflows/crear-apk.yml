name: Crear APK de Reposo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restaurar proyecto
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, io, zipfile
          data = base64.b64decode("")
          zipfile.ZipFile(io.BytesIO(data)).extractall(".")
          PYCODE
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle -p Reposo assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reposo-APK
          path: Reposo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
